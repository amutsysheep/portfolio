{% extends 'base.html' %}

{% block title %}Log In{% endblock %}

{% block styles %}
<link rel="stylesheet" href="{{ url_for('static', filename='css/login.css') }}">
{% endblock %}

{% block content %}
<div class="login-page">
  <div class="login-card">
    <div class="login-logo">
      <span>G</span>
    </div>

    <h1 class="login-title">Log In</h1>
    <p class="login-subtitle">Welkom terug bij GeoTrace</p>

    <form method="post" class="login-form">
      <div class="form-group">
        <label for="email">Email</label>
        <input name="email" id="email" placeholder="Voer je email in" required>
      </div>

      <div class="form-group">
        <label for="password">Wachtwoord</label>
        <input type="password" name="password" id="password" placeholder="Voer je wachtwoord in" required>
      </div>

      <button type="submit" class="login-button">Inloggen</button>
    </form>

    <div class="login-footer">
      <div class="status-row">
        <span class="status-dot"></span>
        <span>System online</span>
      </div>
    </div>
  </div>
</div>
{% endblock %}
